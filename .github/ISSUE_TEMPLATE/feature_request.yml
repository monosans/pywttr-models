name: ✨ Feature request
description: Suggest a new feature or an improvement to pywttr-models.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        pywttr-models only holds the models. New client features belong in
        the [pywttr](https://github.com/monosans/pywttr/issues) or
        [aiopywttr](https://github.com/monosans/aiopywttr/issues) tracker.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing
            issues](https://github.com/monosans/pywttr-models/issues?q=is%3Aissue)
            and found nothing about this.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What are you trying to do, and what gets in the way?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >-
        What should change? Be specific about the behavior you expect.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: How it would look in use.
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
