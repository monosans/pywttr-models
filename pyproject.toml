[project]
name = "pywttr-models"
description = "Pydantic models for the wttr.in weather API, shared by pywttr and aiopywttr"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monosans", email = "hsyqixco@protonmail.com" }]
keywords = [
  "forecast",
  "pydantic",
  "weather",
  "weather-api",
  "wttr",
  "wttr-in",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
urls.changelog = "https://github.com/monosans/pywttr-models/blob/main/CHANGELOG.md"
urls.documentation = "https://monosans.github.io/pywttr/api/#response-models"
urls.issues = "https://github.com/monosans/pywttr-models/issues"
urls.repository = "https://github.com/monosans/pywttr-models"
dependencies = ["pydantic>=2", "typing-extensions>=4.4; python_version < '3.13'"]
dynamic = ["version"]

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.version]
path = "src/pywttr_models/__init__.py"

[tool.uv]
exclude-newer = "3 days"
